<!DOCTYPE html>
<html>
<head>
    <title>Duplicate Question Detector</title>
</head>
<body>
    <h2>Enter two questions:</h2>
    <form method="POST" action="/predict">
        <input type="text" name="q1" placeholder="Enter first question" required><br><br>
        <input type="text" name="q2" placeholder="Enter second question" required><br><br>
        <button type="submit">Check</button>
    </form>

    {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
